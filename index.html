<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>jueguito para mi novia hermosa ❤️</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050510;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 20%,
            #191950 0%,
            #08081d 45%,
            #020208 100%
        );
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#top{
    position:absolute;
    top:12px;
    left:0;
    width:100%;
    padding:0 15px;

    display:flex;
    justify-content:space-between;

    color:white;
    font-size:17px;
    font-weight:bold;

    z-index:10;
    pointer-events:none;
}

#pause{
    position:absolute;
    top:45px;
    right:12px;

    z-index:20;

    border:0;
    border-radius:10px;

    padding:8px 13px;

    color:white;
    background:#ffffff22;

    font-weight:bold;

    touch-action:manipulation;
}

#love{
    position:absolute;

    left:50%;
    top:42%;

    transform:translate(-50%,-50%) scale(.5);

    width:95%;

    text-align:center;

    color:#ff4f86;

    font-size:clamp(25px,7vw,55px);
    font-weight:900;

    line-height:1.15;

    text-shadow:
        0 0 10px #ff1760,
        0 0 25px #ff1760;

    opacity:0;

    z-index:30;

    pointer-events:none;
}

#love.show{
    animation:loveAnimation .9s ease-out;
}

@keyframes loveAnimation{

    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.4);
    }

    20%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.15);
    }

    70%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.05);
    }

}

#controls{
    position:absolute;

    bottom:15px;
    left:0;

    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 15px;

    z-index:20;

    pointer-events:none;
}

.controlGroup{
    display:flex;
    gap:10px;

    pointer-events:auto;
}

.ctrl{
    width:70px;
    height:60px;

    border-radius:18px;

    border:1px solid #ffffff33;

    background:#ffffff1c;

    color:white;

    font-size:28px;

    font-weight:bold;

    touch-action:none;

    user-select:none;
    -webkit-user-select:none;
}

.ctrl:active{
    transform:scale(.92);
    background:#ffffff35;
}

#fire{
    width:110px;

    background:#ff477b;

    font-size:17px;

    box-shadow:
        0 0 15px #ff477b88;

    pointer-events:auto;
}

#fire:active{
    transform:scale(.92);

    background:#ff174f;

    box-shadow:
        0 0 25px #ff477b;
}

#menu{
    position:absolute;
    inset:0;

    z-index:50;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:25px;

    color:white;

    background:#03030ddd;
}

#menu h1{
    margin:0 0 10px;

    font-size:clamp(32px,10vw,60px);

    color:#ff5b8a;

    text-shadow:
        0 0 15px #ff1760,
        0 0 30px #ff1760;
}

#menu p{
    max-width:600px;

    line-height:1.5;

    color:#ddd;
}

#start{
    border:0;

    border-radius:15px;

    padding:15px 25px;

    margin-top:15px;

    background:#ff477b;

    color:white;

    font-size:18px;

    font-weight:bold;

    touch-action:manipulation;
}

</style>

</head>


<body>

<canvas id="canvas"></canvas>


<div id="top">

<span>
Puntos:
<b id="score">0</b>
</span>

<span>
❤️
<b id="lives">3</b>
</span>

</div>


<button id="pause">
Pausa
</button>


<div id="love">

¡TE AMO! ❤️❤️

<br>

<br>

</div>

</div>

<p>

<br><br>

feliz aniversario mi niñaaaaa

<script>


/* =====================================================

   ===================================================== */

const ALIEN_IMAGES = [

    */

];


/* =====================================================
   FRASES DE AMOR ❤️
   ===================================================== */

const LOVE_PHRASES = [

    "¡TE AMO MUCHO MI VIDA! ❤️❤️❤️",

    "¡TE AMOOO LISS! 💖😘❤️",

    "¡FELIZ PRIMER ANIVERSARIO MI VIDA! 💕🥰",

    "¡ERES EL AMOR DE MI VIDA! ❤️❤️",

    "¡TE AMO MÁS CADA DÍA! 💖💖💖",

    "¡ERES MI TODO, MI VIDA! ❤️🥹❤️",

    "¡GRACIAS POR EXISTIR! 💕😘",

    "¡ME HACES EL HOMBRE MÁS FELIZ! ❤️🥰",

    "¡TE AMO CON TODO MI CORAZÓN! ❤️❤️❤️",

    "¡ERES LO MEJOR DE MI VIDA! 💖✨",

    "¡MI NIÑA HERMOSA, TE AMO! 😘❤️",

    "¡QUIERO ESTAR CONTIGO PARA SIEMPRE! 💕♾️",

    "¡CADA MOMENTO CONTIGO ES INCREÍBLE! ❤️🥰",

    "¡TE AMO INFINITAMENTE! ❤️♾️❤️",

    "¡ERES MI PERSONA FAVORITA! 💖😘",

    "¡MI VIDA ES MÁS BONITA CONTIGO! ❤️✨",

    "¡NUNCA DEJARÉ DE AMARTE! ❤️❤️❤️",

    "¡TE AMO DEMASIADO, LISS! 💕🥹",

    "¡GRACIAS POR TANTOS MOMENTOS HERMOSOS! ❤️",

    "¡TÚ Y YO PARA SIEMPRE! 💖♾️",

    "¡ERES MI FELICIDAD! ❤️🥰❤️",

    "¡TE AMO MI AMOR HERMOSO! 💕😘",

    "¡MI CORAZÓN ES TUYO! ❤️❤️❤️",

    "¡ERES MI TODOOO! 💖💖💖",

    "¡TE AMO HOY, MAÑANA Y SIEMPRE! ❤️♾️",

    "¡QUÉ SUERTE TENGO DE TENERTE! 🥰❤️",

    "¡LISS, ERES EL AMOR DE MI VIDA! 💕❤️",

    "¡QUIERO MUCHOS AÑOS MÁS CONTIGO! ❤️💖",

    "¡TE AMO HASTA EL INFINITO! ❤️🌙✨"

];


/* =====================================================
   VARIABLES
   ===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const scoreElement =
    document.getElementById("score");

const livesElement =
    document.getElementById("lives");

const loveElement =
    document.getElementById("love");


const menu =
    document.getElementById("menu");

const startButton =
    document.getElementById("start");

const pauseButton =
    document.getElementById("pause");


const leftButton =
    document.getElementById("left");

const rightButton =
    document.getElementById("right");

const fireButton =
    document.getElementById("fire");


let W = 0;
let H = 0;

let playing = false;
let paused = false;

let score = 0;
let lives = 3;

let lastTime = 0;

let player = null;

let bullets = [];
let aliens = [];
let particles = [];
let stars = [];

let alienImages = [];

let movingLeft = false;
let movingRight = false;

let levelStarting = false;


/* =====================================================
   VARIABLES DEL JEFE 👑
   ===================================================== */

let boss = null;

let bossActive = false;

let bossMessageActive = false;


/* =====================================================
   TAMAÑO DEL CANVAS
   ===================================================== */

function resizeCanvas(){

    W = window.innerWidth;

    H = window.innerHeight;

    canvas.width = W;

    canvas.height = H;


    if(player){

        player.y = H - 110;

    }

}

resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   CARGAR IMÁGENES
   ===================================================== */

function loadAlienImages(){

    alienImages = [];


    for(
        let i = 0;
        i < ALIEN_IMAGES.length;
        i++
    ){

        const image = new Image();


        image.onload = function(){

            draw();

        };


        image.src =
            ALIEN_IMAGES[i];


        alienImages.push(image);

    }

}


/* =====================================================
   ESTRELLAS
   ===================================================== */

function createStars(){

    stars = [];


    for(
        let i = 0;
        i < 120;
        i++
    ){

        stars.push({

            x:
                Math.random() * W,

            y:
                Math.random() * H,

            size:
                Math.random() * 2 + .5,

            speed:
                Math.random() * 30 + 10

        });

    }

}


createStars();


/* =====================================================
   CREAR ALIENS
   ===================================================== */

function createAliens(){

    aliens = [];


    const columns =
        Math.max(
            5,
            Math.min(
                9,
                Math.floor(W / 65)
            )
        );


    const rows = 3;


    const spacing =
        Math.min(
            70,
            (W - 60) / columns
        );


    const startX =
        W / 2 -
        spacing * (columns - 1) / 2;


    for(
        let row = 0;
        row < rows;
        row++
    ){

        for(
            let column = 0;
            column < columns;
            column++
        ){

            aliens.push({

                x:
                    startX +
                    column * spacing,

                y:
                    110 +
                    row * 55,

                width:44,

                height:38,

                direction:1,

                imageIndex:
                    ALIEN_IMAGES.length > 0
                    ?
                    (
                        row * columns +
                        column
                    )
                    %
                    ALIEN_IMAGES.length
                    :
                    0

            });

        }

    }

}


/* =====================================================
   INICIAR JUEGO
   ===================================================== */

function startGame(){

    loadAlienImages();


    score = 0;

    lives = 3;


    scoreElement.textContent =
        score;

    livesElement.textContent =
        lives;


    player = {

        x:
            W / 2,

        y:
            H - 110,

        width:50,

        height:35,

        speed:380,

        cooldown:0

    };


    bullets = [];

    particles = [];


    movingLeft = false;

    movingRight = false;


    levelStarting = false;


    boss = null;

    bossActive = false;

    bossMessageActive = false;


    createAliens();


    playing = true;

    paused = false;


    pauseButton.textContent =
        "Pausa";


    menu.style.display =
        "none";

}


/* =====================================================
   DISPARAR 🚀
   ===================================================== */

function shoot(){

    if(!playing){
        return;
    }


    if(paused){
        return;
    }


    if(!player){
        return;
    }


    if(player.cooldown > 0){
        return;
    }


    bullets.push({

        x:
            player.x,

        y:
            player.y - 30,

        width:6,

        height:20,

        speed:720

    });


    player.cooldown =
        .18;

}


/* =====================================================
   BOTÓN DISPARAR
   ===================================================== */

fireButton.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

        event.stopPropagation();

        shoot();

    }
);


fireButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();

    }
);


/* =====================================================
   IZQUIERDA
   ===================================================== */

function startMoveLeft(event){

    event.preventDefault();

    movingLeft = true;


    try{

        leftButton.setPointerCapture(
            event.pointerId
        );

    }
    catch(error){}

}


function stopMoveLeft(event){

    event.preventDefault();

    movingLeft = false;

}


leftButton.addEventListener(
    "pointerdown",
    startMoveLeft
);


leftButton.addEventListener(
    "pointerup",
    stopMoveLeft
);


leftButton.addEventListener(
    "pointercancel",
    stopMoveLeft
);


leftButton.addEventListener(
    "lostpointercapture",
    function(){

        movingLeft = false;

    }
);


/* =====================================================
   DERECHA
   ===================================================== */

function startMoveRight(event){

    event.preventDefault();

    movingRight = true;


    try{

        rightButton.setPointerCapture(
            event.pointerId
        );

    }
    catch(error){}

}


function stopMoveRight(event){

    event.preventDefault();

    movingRight = false;

}


rightButton.addEventListener(
    "pointerdown",
    startMoveRight
);


rightButton.addEventListener(
    "pointerup",
    stopMoveRight
);


rightButton.addEventListener(
    "pointercancel",
    stopMoveRight
);


rightButton.addEventListener(
    "lostpointercapture",
    function(){

        movingRight = false;

    }
);


/* =====================================================
   TECLADO
   ===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ){

            movingLeft = true;

        }


        if(
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ){

            movingRight = true;

        }


        if(event.code === "Space"){

            event.preventDefault();

            shoot();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event){

        if(
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ){

            movingLeft = false;

        }


        if(
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ){

            movingRight = false;

        }

    }
);


/* =====================================================
   MENÚ
   ===================================================== */

startButton.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

        startGame();

    }
);


/* =====================================================
   PAUSA
   ===================================================== */

pauseButton.addEventListener(
    "click",
    function(){

        if(!playing){
            return;
        }


        paused =
            !paused;


        pauseButton.textContent =
            paused
            ?
            "Continuar"
            :
            "Pausa";

    }
);


/* =====================================================
   EXPLOSIÓN
   ===================================================== */

function explosion(x,y){

    for(
        let i = 0;
        i < 20;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random() - .5) *
                320,

            vy:
                (Math.random() - .5) *
                320,

            life:
                .4 +
                Math.random() * .6

        });

    }

}


/* =====================================================
   FRASE DE AMOR ❤️
   ===================================================== */

function showLove(){

    const randomIndex =
        Math.floor(
            Math.random() *
            LOVE_PHRASES.length
        );


    loveElement.innerHTML =
        LOVE_PHRASES[randomIndex];


    loveElement.classList.remove(
        "show"
    );


    void loveElement.offsetWidth;


    loveElement.classList.add(
        "show"
    );

}


/* =====================================================
   MENSAJE DEL JEFE ❤️
   ===================================================== */

function showBossLove(){

    bossMessageActive = true;


    loveElement.innerHTML =

        "❤️❤️❤️<br>" +

        "<span style='font-size:.65em'>" +

        "LA VERDAD ERES LO MEJOR<br>" +

        "QUE ME HA PASADO ❤️<br><br>" +

        "ERES MI TODO 💖<br><br>" +

        "MUCHAS GRACIAS POR TODO<br>" +

        "ESTE TIEMPO, MI VIDA ❤️🥹❤️" +

        "</span>" +

        "<br>❤️❤️❤️";


    loveElement.classList.remove(
        "show"
    );


    void loveElement.offsetWidth;


    loveElement.classList.add(
        "show"
    );

}


/* =====================================================
   CREAR JEFE 👑
   ===================================================== */

function createBoss(){

    boss = {

        x:
            W / 2,

        y:
            120,

        width:
            100,

        height:
            80,

        health:
            20,

        maxHealth:
            20,

        direction:
            1,

        speed:
            100

    };


    bossActive = true;
      }

      /* =====================================================
   GAME OVER
   ===================================================== */

function gameOver(){

    playing = false;

    movingLeft = false;
    movingRight = false;

    boss = null;
    bossActive = false;

    menu.style.display = "flex";

    menu.querySelector("h1").textContent =
        "FIN DEL JUEGO 💔";

    menu.querySelector("p").innerHTML =
        "Puntaje final: <b>" +
        score +
        "</b><br><br>" +
        "Pero recuerda... ❤️";

    startButton.textContent =
        "🚀 JUGAR DE NUEVO";

}


/* =====================================================
   ACTUALIZAR JUEGO
   ===================================================== */

function update(delta){

    if(!playing || paused){
        return;
    }


    /* =================================================
       JUGADOR
       ================================================= */

    if(movingLeft){

        player.x -=
            player.speed * delta;

    }


    if(movingRight){

        player.x +=
            player.speed * delta;

    }


    player.x =
        Math.max(
            30,
            Math.min(
                W - 30,
                player.x
            )
        );


    player.cooldown =
        Math.max(
            0,
            player.cooldown - delta
        );


    /* =================================================
       ESTRELLAS
       ================================================= */

    for(const star of stars){

        star.y +=
            star.speed * delta;


        if(star.y > H){

            star.y = 0;

            star.x =
                Math.random() * W;

        }

    }


    /* =================================================
       BALAS
       ================================================= */

    for(const bullet of bullets){

        bullet.y -=
            bullet.speed * delta;

    }


    bullets =
        bullets.filter(
            bullet =>
                bullet.y > -40
        );


    /* =================================================
       JEFE 👑
       ================================================= */

    if(bossActive && boss){

        boss.x +=
            boss.direction *
            boss.speed *
            delta;


        if(
            boss.x + boss.width / 2 >= W - 20 ||
            boss.x - boss.width / 2 <= 20
        ){

            boss.direction *= -1;

        }

    }


    /* =================================================
       ALIENS
       ================================================= */

    const speed =
        45 +
        score * .15;


    let changeDirection = false;


    /*
       Si hay jefe, los aliens normales
       dejan de moverse para que el jefe
       sea el protagonista.
    */

    if(!bossActive){

        for(const alien of aliens){

            if(
                alien.x + alien.width / 2 >= W - 20 ||
                alien.x - alien.width / 2 <= 20
            ){

                changeDirection = true;

            }

        }


        if(changeDirection){

            for(const alien of aliens){

                alien.direction *= -1;

                alien.y += 22;

            }

        }


        for(const alien of aliens){

            alien.x +=
                alien.direction *
                speed *
                delta;

        }

    }


    /* =================================================
       COLISIONES BALAS / ALIENS
       ================================================= */

    for(
        let b = bullets.length - 1;
        b >= 0;
        b--
    ){

        const bullet =
            bullets[b];


        for(
            let a = aliens.length - 1;
            a >= 0;
            a--
        ){

            const alien =
                aliens[a];


            const collision =

                Math.abs(
                    bullet.x - alien.x
                )
                <
                alien.width * .55

                &&

                Math.abs(
                    bullet.y - alien.y
                )
                <
                alien.height * .65;


            if(collision){

                bullets.splice(
                    b,
                    1
                );


                aliens.splice(
                    a,
                    1
                );


                score += 10;


                scoreElement.textContent =
                    score;


                explosion(
                    alien.x,
                    alien.y
                );


                /*
                   FRASE DIFERENTE/ALEATORIA ❤️
                */

                showLove();


                break;

            }

        }

    }


    /* =================================================
       BALAS CONTRA JEFE 👑
       ================================================= */

    if(bossActive && boss){

        for(
            let b = bullets.length - 1;
            b >= 0;
            b--
        ){

            const bullet =
                bullets[b];


            const hit =

                Math.abs(
                    bullet.x - boss.x
                )
                <
                boss.width * .55

                &&

                Math.abs(
                    bullet.y - boss.y
                )
                <
                boss.height * .55;


            if(hit){

                bullets.splice(
                    b,
                    1
                );


                boss.health--;


                explosion(
                    bullet.x,
                    bullet.y
                );


                /*
                   JEFE DERROTADO
                */

                if(boss.health <= 0){

                    explosion(
                        boss.x,
                        boss.y
                    );


                    explosion(
                        boss.x - 35,
                        boss.y
                    );


                    explosion(
                        boss.x + 35,
                        boss.y
                    );


                    explosion(
                        boss.x,
                        boss.y - 30
                    );


                    /*
                       BONUS DEL JEFE
                    */

                    score += 100;


                    scoreElement.textContent =
                        score;


                    boss = null;

                    bossActive = false;


                    /*
                       MENSAJE ESPECIAL ❤️
                    */

                    showBossLove();


                    /*
                       Después de un momento
                       desaparecen los aliens
                       anteriores y comienza
                       otra ronda.
                    */

                    setTimeout(
                        function(){

                            if(
                                playing &&
                                !bossActive
                            ){

                                createAliens();

                            }

                        },
                        1200
                    );

                }

            }

        }

    }


    /* =================================================
       ALIENS LLEGAN AL JUGADOR
       ================================================= */

    if(!bossActive){

        for(const alien of aliens){

            if(
                alien.y >
                player.y - 20
            ){

                gameOver();

                return;

            }

        }

    }


    /* =================================================
       NIVEL TERMINADO
       ================================================= */

    if(
        aliens.length === 0 &&
        !levelStarting &&
        !bossActive
    ){

        levelStarting = true;


        /*
           Cada ronda da 100 puntos.
        */

        score += 100;


        scoreElement.textContent =
            score;


        /*
           CADA 100 PUNTOS APARECE JEFE 👑
        */

        if(
            score % 100 === 0
        ){

            createBoss();

        }
        else{

            setTimeout(
                function(){

                    if(
                        playing &&
                        !bossActive
                    ){

                        createAliens();

                        levelStarting =
                            false;

                    }

                },
                700
            );

        }

    }


    /* =================================================
       PARTÍCULAS
       ================================================= */

    for(const particle of particles){

        particle.x +=
            particle.vx * delta;


        particle.y +=
            particle.vy * delta;


        particle.vy +=
            200 * delta;


        particle.life -=
            delta;

    }


    particles =
        particles.filter(
            particle =>
                particle.life > 0
        );

}


/* =====================================================
   DIBUJAR NAVE 🚀
   ===================================================== */

function drawPlayer(){

    if(!player){
        return;
    }


    ctx.save();


    ctx.translate(
        player.x,
        player.y
    );


    /* FUEGO */

    ctx.fillStyle =
        "#ff7b35";

    ctx.shadowColor =
        "#ff5722";

    ctx.shadowBlur =
        15;


    ctx.beginPath();

    ctx.moveTo(
        -8,
        15
    );

    ctx.lineTo(
        0,
        30
    );

    ctx.lineTo(
        8,
        15
    );

    ctx.closePath();

    ctx.fill();


    /* NAVE */

    ctx.fillStyle =
        "#8eeaff";

    ctx.shadowColor =
        "#33dfff";

    ctx.shadowBlur =
        15;


    ctx.beginPath();

    ctx.moveTo(
        0,
        -25
    );

    ctx.lineTo(
        27,
        20
    );

    ctx.lineTo(
        9,
        14
    );

    ctx.lineTo(
        0,
        21
    );

    ctx.lineTo(
        -9,
        14
    );

    ctx.lineTo(
        -27,
        20
    );

    ctx.closePath();

    ctx.fill();


    ctx.shadowBlur = 0;


    /* VENTANA */

    ctx.fillStyle =
        "white";


    ctx.beginPath();

    ctx.arc(
        0,
        -8,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   DIBUJAR ALIEN 👾
   ===================================================== */

function drawAlien(alien){

    ctx.save();


    ctx.translate(
        alien.x,
        alien.y
    );


    const image =
        alienImages[
            alien.imageIndex
        ];


    if(
        image &&
        image.complete &&
        image.naturalWidth > 0
    ){

        const scale =
            Math.min(
                alien.width /
                    image.naturalWidth,

                alien.height /
                    image.naturalHeight
            );


        const width =
            image.naturalWidth *
            scale;


        const height =
            image.naturalHeight *
            scale;


        ctx.drawImage(
            image,

            -width / 2,
            -height / 2,

            width,
            height
        );

    }
    else{

        /* ALIEN POR DEFECTO */

        ctx.fillStyle =
            "#72ff7a";

        ctx.shadowColor =
            "#40ff55";

        ctx.shadowBlur =
            10;


        ctx.fillRect(
            -18,
            -12,
            36,
            24
        );


        ctx.fillRect(
            -25,
            -5,
            7,
            13
        );


        ctx.fillRect(
            18,
            -5,
            7,
            13
        );


        ctx.shadowBlur = 0;


        ctx.fillStyle =
            "#07100a";


        ctx.fillRect(
            -10,
            -6,
            6,
            6
        );


        ctx.fillRect(
            4,
            -6,
            6,
            6
        );

    }


    ctx.restore();

}


/* =====================================================
   DIBUJAR JEFE 👑
   ===================================================== */

function drawBoss(){

    if(
        !bossActive ||
        !boss
    ){

        return;

    }


    ctx.save();


    ctx.translate(
        boss.x,
        boss.y
    );


    /* AURA */

    ctx.shadowColor =
        "#ff174f";

    ctx.shadowBlur =
        30;


    /* CUERPO DEL JEFE */

    ctx.fillStyle =
        "#ff315f";


    ctx.beginPath();

    ctx.moveTo(
        0,
        -40
    );

    ctx.lineTo(
        55,
        -15
    );

    ctx.lineTo(
        45,
        35
    );

    ctx.lineTo(
        20,
        45
    );

    ctx.lineTo(
        0,
        30
    );

    ctx.lineTo(
        -20,
        45
    );

    ctx.lineTo(
        -45,
        35
    );

    ctx.lineTo(
        -55,
        -15
    );

    ctx.closePath();

    ctx.fill();


    ctx.shadowBlur = 0;


    /* OJOS */

    ctx.fillStyle =
        "white";


    ctx.fillRect(
        -27,
        -10,
        15,
        15
    );


    ctx.fillRect(
        12,
        -10,
        15,
        15
    );


    /* CORAZÓN */

    ctx.font =
        "35px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "❤️",
        0,
        12
    );


    ctx.restore();


    /* =================================================
       BARRA DE VIDA
       ================================================= */

    const barWidth = 140;

    const barHeight = 11;


    const healthPercent =
        boss.health /
        boss.maxHealth;


    /* FONDO */

    ctx.fillStyle =
        "#33000d";


    ctx.fillRect(
        boss.x - barWidth / 2,
        boss.y - 58,
        barWidth,
        barHeight
    );


    /* VIDA */

    ctx.fillStyle =
        "#ff315f";


    ctx.fillRect(
        boss.x - barWidth / 2,
        boss.y - 58,
        barWidth * healthPercent,
        barHeight
    );


    /* BORDE */

    ctx.strokeStyle =
        "white";


    ctx.strokeRect(
        boss.x - barWidth / 2,
        boss.y - 58,
        barWidth,
        barHeight
    );


    /* TEXTO */

    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 14px Arial";

    ctx.textAlign =
        "center";


    ctx.fillText(
        "👑 JEFE",
        boss.x,
        boss.y - 68
    );

}


/* =====================================================
   DIBUJAR TODO
   ===================================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* =================================================
       ESTRELLAS
       ================================================= */

    for(const star of stars){

        ctx.globalAlpha =
            .4;

        ctx.fillStyle =
            "white";


        ctx.fillRect(
            star.x,
            star.y,
            star.size,
            star.size
        );

    }


    ctx.globalAlpha = 1;


    if(!player){

        return;

    }


    /* =================================================
       NAVE
       ================================================= */

    drawPlayer();


    /* =================================================
       ALIENS
       ================================================= */

    for(const alien of aliens){

        drawAlien(alien);

    }


    /* =================================================
       JEFE
       ================================================= */

    drawBoss();


    /* =================================================
       BALAS
       ================================================= */

    ctx.fillStyle =
        "#fff16a";

    ctx.shadowColor =
        "#fff16a";

    ctx.shadowBlur =
        12;


    for(const bullet of bullets){

        ctx.fillRect(

            bullet.x -
            bullet.width / 2,

            bullet.y,

            bullet.width,

            bullet.height

        );

    }


    ctx.shadowBlur = 0;


    /* =================================================
       EXPLOSIONES
       ================================================= */

    for(const particle of particles){

        ctx.globalAlpha =
            Math.max(
                0,
                particle.life
            );


        ctx.fillStyle =
            "#ff5b8a";


        ctx.fillRect(
            particle.x,
            particle.y,
            5,
            5
        );

    }


    ctx.globalAlpha = 1;

}


/* =====================================================
   BUCLE PRINCIPAL
   ===================================================== */

function gameLoop(time){

    if(!lastTime){

        lastTime = time;

    }


    let delta =
        (time - lastTime) / 1000;


    lastTime =
        time;


    delta =
        Math.min(
            delta,
            .033
        );


    update(delta);

    draw();


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);
