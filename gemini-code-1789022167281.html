<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego - Control de Power-Ups</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #game-container {
      position: relative;
      margin-top: 10px;
    }

    canvas {
      border: 2px solid #444;
      background-color: #111;
      border-radius: 8px;
    }

    #ui-panel {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    /* Botón de la UI: Solo activa el Power-Up guardado */
    #btn-powerup {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #btn-powerup:disabled {
      background-color: #555555;
      color: #888888;
      cursor: not-allowed;
    }

    #status {
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>Juego con Power-Ups</h1>
  <p>Mueve el jugador (rojo) con las flechas del teclado para recoger el Power-Up (amarillo) del mapa.</p>

  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
  </div>

  <div id="ui-panel">
    <!-- El botón SOLO activa, NO genera nuevos ítems -->
    <button id="btn-powerup" disabled onclick="activarPowerUpGuardado()">
      POWER-UP VACÍO
    </button>
    <div id="status">Estado: Buscando Power-Up en el mapa...</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const btnPowerUp = document.getElementById('btn-powerup');
    const statusText = document.getElementById('status');

    // --- ESTADO DEL JUEGO ---
    const jugador = {
      x: 50,
      y: 180,
      radio: 15,
      velocidadBase: 3,
      velocidadActual: 3,
      powerUpGuardado: null // Guarda el tipo recolectado ('turbo', 'escudo', etc.)
    };

    // Objeto recolectable en el mapa (null si no hay ninguno en pantalla)
    let powerUpEnMapa = null;

    // --- CONTROLES DE TECLADO ---
    const teclas = {};
    window.addEventListener('keydown', (e) => teclas[e.key] = true);
    window.addEventListener('keyup', (e) => teclas[e.key] = false);

    // --- GENERADOR AUTOMÁTICO DE MAPA (Spawner Independiente) ---
    function generarPowerUpEnMapa() {
      // Solo genera uno si no hay ningún ítem presente en el escenario
      if (!powerUpEnMapa) {
        powerUpEnMapa = {
          x: Math.random() * (canvas.width - 40) + 20,
          y: Math.random() * (canvas.height - 40) + 20,
          radio: 10,
          tipo: 'TURBO'
        };
        statusText.innerText = "Estado: ¡Apareció un Power-Up en el mapa!";
      }
    }

    // Genera automáticamente un ítem en el escenario cada 6 segundos
    setInterval(generarPowerUpEnMapa, 6000);

    // --- LÓGICA DEL BOTÓN DE LA UI ---
    function activarPowerUpGuardado() {
      // Condición estricta: El botón NO funciona si no se ha recogido nada
      if (!jugador.powerUpGuardado) return;

      if (jugador.powerUpGuardado === 'TURBO') {
        jugador.velocidadActual = jugador.velocidadBase * 2.5;
        statusText.innerText = "Estado: ¡TURBO ACTIVADO! (Velocidad Aumentada)";

        // El efecto dura 4 segundos
        setTimeout(() => {
          jugador.velocidadActual = jugador.velocidadBase;
          statusText.innerText = "Estado: El efecto del Turbo ha finalizado.";
        }, 4000);
      }

      // Consumir el Power-Up y actualizar la UI
      jugador.powerUpGuardado = null;
      btnPowerUp.disabled = true;
      btnPowerUp.innerText = "POWER-UP VACÍO";
    }

    // --- BUCLE PRINCIPAL DE JUGABILIDAD ---
    function actualizar() {
      // Movimiento
      if (teclas['ArrowUp'] && jugador.y - jugador.radio > 0) jugador.y -= jugador.velocidadActual;
      if (teclas['ArrowDown'] && jugador.y + jugador.radio < canvas.height) jugador.y += jugador.velocidadActual;
      if (teclas['ArrowLeft'] && jugador.x - jugador.radio > 0) jugador.x -= jugador.velocidadActual;
      if (teclas['ArrowRight'] && jugador.x + jugador.radio < canvas.width) jugador.x += jugador.velocidadActual;

      // Colisión entre Jugador y Power-Up en el mapa
      if (powerUpEnMapa) {
        const dx = jugador.x - powerUpEnMapa.x;
        const dy = jugador.y - powerUpEnMapa.y;
        const distancia = Math.sqrt(dx * dx + dy * dy);

        if (distancia < jugador.radio + powerUpEnMapa.radio) {
          // Recoger ítem del mapa
          jugador.powerUpGuardado = powerUpEnMapa.tipo;
          powerUpEnMapa = null; // Elimina el objeto del mapa

          // Habilitar el botón de activación
          btnPowerUp.disabled = false;
          btnPowerUp.innerText = `ACTIVAR ${jugador.powerUpGuardado}`;
          statusText.innerText = "Estado: Power-Up recolectado. Presiona el botón para usarlo.";
        }
      }
    }

    function renderizar() {
      // Limpiar mapa
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar Ítem en el mapa (si existe)
      if (powerUpEnMapa) {
        ctx.beginPath();
        ctx.arc(powerUpEnMapa.x, powerUpEnMapa.y, powerUpEnMapa.radio, 0, Math.PI * 2);
        ctx.fillStyle = '#ffeb3b';
        ctx.fill();
        ctx.closePath();
      }

      // Dibujar Jugador
      ctx.beginPath();
      ctx.arc(jugador.x, jugador.y, jugador.radio, 0, Math.PI * 2);
      ctx.fillStyle = '#f44336';
      ctx.fill();
      ctx.closePath();
    }

    function gameLoop() {
      actualizar();
      renderizar();
      requestAnimationFrame(gameLoop);
    }

    // Iniciar juego
    generarPowerUpEnMapa();
    gameLoop();
  </script>
</body>
</html>
